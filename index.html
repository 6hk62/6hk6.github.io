<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BDL Link Falso</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body, html { width:100%; height:100%; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow:hidden; }

  /* Fundo rosa mais suave */
  body {
    background: linear-gradient(270deg, #ff5ca8, #ff82c2, #ff66b2, #ff3399);
    background-size: 600% 600%;
    animation: gradientBG 14s ease infinite;
  }
  @keyframes gradientBG {
    0% { background-position:0% 50%; }
    50% { background-position:100% 50%; }
    100% { background-position:0% 50%; }
  }

  canvas { position:fixed; top:0; left:0; z-index:0; }

  .container {
    position: relative;
    z-index: 10;
    backdrop-filter: blur(12px) saturate(180%);
    -webkit-backdrop-filter: blur(12px) saturate(180%);
    background: rgba(0,0,0,0.55);
    padding: 40px;
    border-radius: 20px;
    width: 100%;
    max-width: 420px;
    margin: auto;
    top:50%;
    transform: translateY(-50%);
    text-align:center;
    color:#fff;
    box-shadow: 0 0 20px rgba(255,100,200,0.6);
    border: 1px solid rgba(255,100,200,0.3);
  }

  h1 {
    font-size:2.2rem;
    margin-bottom:25px;
    text-shadow:0 0 12px rgba(255,255,255,0.7);
    letter-spacing:1px;
    color:#fff;
  }

  input {
    width:100%;
    padding:14px;
    margin:12px 0;
    border:none;
    border-radius:10px;
    background: rgba(255,255,255,0.15);
    color:#fff;
    font-size:1rem;
    transition: all 0.3s ease;
  }
  input:focus {
    outline:none;
    background: rgba(255,255,255,0.25);
    box-shadow: 0 0 10px #fff;
  }

  button {
    display:block;
    width:100%;
    margin:10px 0;
    padding:14px 24px;
    background: linear-gradient(135deg, #ff4db8, #ff66cc);
    border:none;
    border-radius:12px;
    color:#fff;
    font-size:1.1rem;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 0 12px rgba(255,0,150,0.7);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  button:hover {
    transform:scale(1.05);
    box-shadow:0 0 18px #fff;
  }

  .note {
    margin-top:18px;
    font-size:0.9rem;
    color:#eee;
    opacity:0.9;
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="container">
  <h1>BDL Link Falso</h1>
  <input id="link1" type="text" placeholder="Link steal a brainrot">
  <input id="link2" type="text" placeholder="Link camuflagem">
  <button onclick="copiar()">✨ Copiar Link</button>
  <button onclick="window.open('https://discord.gg/2RZuYh3xHb','_blank')">💬 Entrar no Discord</button>
  <div class="note">O link será copiado automaticamente para a área de transferência.</div>
</div>

<script>
  // --------- Copiar link ---------
  function copiar() {
    const l1 = document.getElementById('link1').value.trim();
    const l2 = document.getElementById('link2').value.trim();
    if(!l1 || !l2){ alert("Preencha os dois links antes de copiar!"); return; }
    const resultado = `<${l1}>[s](${l2})`;
    navigator.clipboard.writeText(resultado).then(() => alert("✅ Link copiado com sucesso!"))
    .catch(()=>alert("❌ Erro ao copiar o link!"));
  }

  // --------- Partículas Canvas ---------
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  let w = canvas.width = window.innerWidth;
  let h = canvas.height = window.innerHeight;
  const particles = [];
  const particleCount = 90;
  const mouse = {x:null, y:null, radius:150};

  window.addEventListener('resize', () => {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  });

  window.addEventListener('mousemove', e => { mouse.x = e.x; mouse.y = e.y; });
  window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });

  class Particle {
    constructor(){
      this.x = Math.random()*w;
      this.y = Math.random()*h;
      this.size = Math.random()*3 + 1;
      this.speedX = (Math.random()-0.5)/1.5;
      this.speedY = (Math.random()-0.5)/1.5;
    }
    update(){
      this.x += this.speedX;
      this.y += this.speedY;
      if(this.x < 0 || this.x > w) this.speedX *= -1;
      if(this.y < 0 || this.y > h) this.speedY *= -1;
    }
    draw(){
      ctx.fillStyle = 'rgba(255,255,255,0.9)'; // bolinhas brancas
      ctx.beginPath();
      ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
      ctx.fill();
    }
  }

  function initParticles(){
    for(let i=0;i<particleCount;i++) particles.push(new Particle());
  }

  function connect(){
    for(let a=0;a<particles.length;a++){
      for(let b=a;b<particles.length;b++){
        let dx = particles[a].x - particles[b].x;
        let dy = particles[a].y - particles[b].y;
        let dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < 130){
          ctx.strokeStyle = 'rgba(255,255,255,'+ (1 - dist/130) +')';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(particles[a].x, particles[a].y);
          ctx.lineTo(particles[b].x, particles[b].y);
          ctx.stroke();
        }
      }
      if(mouse.x && mouse.y){
        let dx = particles[a].x - mouse.x;
        let dy = particles[a].y - mouse.y;
        let dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < mouse.radius){
          ctx.strokeStyle = 'rgba(255,255,255,'+ (1 - dist/mouse.radius) +')';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(particles[a].x, particles[a].y);
          ctx.lineTo(mouse.x, mouse.y);
          ctx.stroke();
        }
      }
    }
  }

  function animate(){
    ctx.clearRect(0,0,w,h);
    particles.forEach(p => { p.update(); p.draw(); });
    connect();
    requestAnimationFrame(animate);
  }

  initParticles();
  animate();
</script>

</body>
</html>
